[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/sociales"
  to = "https://showinteractivo.com/eventos-sociales/"
  status = 301
  force = true

[[redirects]]
  from = "/sociales/bodas/"
  to = "https://showinteractivo.com/eventos-sociales/bodas/"
  status = 301
  force = true

[[redirects]]
  from = "/sociales/cumple-de-15/"
  to = "https://showinteractivo.com/eventos-sociales/cumple-de-15/"
  status = 301
  force = true

[[redirects]]
  from = "/sociales/cumpleanos-de-adultos/"
  to = "https://showinteractivo.com/eventos-sociales/cumpleanos-de-adultos/"
  status = 301
  force = true

[[redirects]]
  from = "/sociales/testimonios/"
  to = "https://showinteractivo.com/eventos-sociales/testimonios/"
  status = 301
  force = true

[[redirects]]
  from = "/sociales/gracias/"
  to = "https://showinteractivo.com/eventos-sociales/gracias/"
  status = 301
  force = true

[[redirects]]
  from = "/sociales/*"
  to = "https://showinteractivo.com/eventos-sociales/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/corporativos"
  to = "https://showinteractivo.com/eventos-corporativos/"
  status = 301
  force = true

[[redirects]]
  from = "/corporativos/fiesta-corporativa/"
  to = "https://showinteractivo.com/eventos-corporativos/fiesta-corporativa/"
  status = 301
  force = true

[[redirects]]
  from = "/corporativos/team-building/"
  to = "https://showinteractivo.com/eventos-corporativos/team-building/"
  status = 301
  force = true

[[redirects]]
  from = "/corporativos/otros/"
  to = "https://showinteractivo.com/eventos-corporativos/otros/"
  status = 301
  force = true

[[redirects]]
  from = "/corporativos/testimonios/"
  to = "https://showinteractivo.com/eventos-corporativos/testimonios/"
  status = 301
  force = true

[[redirects]]
  from = "/corporativos/gracias/"
  to = "https://showinteractivo.com/eventos-corporativos/gracias/"
  status = 301
  force = true

[[redirects]]
  from = "/corporativos/*"
  to = "https://showinteractivo.com/eventos-corporativos/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/eventos/empresariales/"
  to = "https://showinteractivo.com/eventos-corporativos/"
  status = 301
  force = true

[[redirects]]
  from = "/eventos-empresariales/"
  to = "https://showinteractivo.com/eventos-corporativos/"
  status = 301
  force = true

[[redirects]]
  from = "/eventos/"
  to = "https://showinteractivo.com/eventos-corporativos/"
  status = 301
  force = true

[[redirects]]
  from = "/evento/"
  to = "https://showinteractivo.com/eventos-corporativos/"
  status = 301
  force = true

[[redirects]]
  from = "/landing_sociales.html"
  to = "https://showinteractivo.com/eventos-sociales/"
  status = 301

[[redirects]]
  from = "/landing_corporativos.html"
  to = "https://showinteractivo.com/eventos-corporativos/"
  status = 301

[[redirects]]
  from = "/testimonios-sociales.html"
  to = "https://showinteractivo.com/eventos-sociales/testimonios/"
  status = 301

[[redirects]]
  from = "/testimonios-corporativos.html"
  to = "https://showinteractivo.com/eventos-corporativos/testimonios/"
  status = 301

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
